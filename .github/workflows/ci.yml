name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: claimforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLAIMFORGE_TEAM_RLS_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/claimforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # `.grok/` is gitignored. ClaimForge is auth-off; materialize the flag so
      # first-party tests and the production build agree with the sandbox.
      - name: Materialize auth-off app-env
        run: |
          mkdir -p .grok
          if [ ! -f .grok/app-env.json ]; then
            printf '%s\n' '{"VITE_AUTH_ENABLED":"false"}' > .grok/app-env.json
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit:deps
      - run: npm run build
